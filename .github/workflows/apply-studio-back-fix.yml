name: Apply Studio Back Fix

on:
  push:
    branches: [client-fixes-1-4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-fixes-1-4
          fetch-depth: 0
      - name: Patch style number
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/kasha/src/pages/products.tsx')
          s = p.read_text()
          if 'Style {product.sku}' not in s:
              marker = '      {(() => {\n        const colorLabel = getProductColorLabel(product);'
              insert = '''      {product.sku && (\n        <p style={{ fontFamily: "'Josefin Sans', sans-serif", fontSize: 8.5, letterSpacing: "0.16em", color: "rgba(0,0,0,0.42)", textTransform: "uppercase", marginBottom: 3 }}>\n          Style {product.sku}\n        </p>\n      )}\n'''
              if s.count(marker) != 1:
                  raise SystemExit(f'Style number insertion marker count={s.count(marker)}; refusing unsafe edit')
              s = s.replace(marker, insert + marker, 1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/kasha/src/pages/products.tsx
          git diff --cached --quiet || git commit -m "fix: display style number on product cards"
          git push origin HEAD:client-fixes-1-4
