name: Apply Style Number Fix

on:
  push:
    branches: [client-fixes-1-4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-fixes-1-4
          fetch-depth: 0
      - name: Add style number to product cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/kasha/src/pages/products.tsx')
          s = p.read_text()
          anchor = '''      <h3 className="text-neutral-900 mb-0.5 group-hover:!text-[#B8925A] transition-colors" style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 15, fontWeight: 500, lineHeight: 1.3 }}>
        {product.name.replace(/\\s+[—–-]\\s*[A-Z]{1,3}\\d+.*$/, "")}
      </h3>
'''
          insert = anchor + '''      {product.sku && (
        <p style={{ fontFamily: "'Josefin Sans', sans-serif", fontSize: 8.5, letterSpacing: "0.16em", color: "rgba(0,0,0,0.42)", textTransform: "uppercase", marginBottom: 3 }}>
          Style {product.sku}
        </p>
      )}
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'Product card title anchor count={s.count(anchor)}; refusing unsafe edit')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/kasha/src/pages/products.tsx
          git diff --cached --quiet || git commit -m "fix: display style number on product cards"
          git push origin HEAD:client-fixes-1-4
